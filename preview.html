<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>网页图片预览</title>
<style>
  :root { color-scheme: light; --bg: #f5f6f8; --card: #fff; --text: #1f2328; --muted: #6b7280; --border: #e3e6ea; --accent: #1f6feb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; padding: 0 0 28px; }
  .top { position: sticky; top: 0; z-index: 9; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(245,246,248,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  .top a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .top h1 { font-size: 16px; margin: 0; flex: 1; text-align: center; }
  .wrap { padding: 12px 12px 0; max-width: 720px; margin: 0 auto; }
  .note { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .note.err { color: #c1202d; }
  .task { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .task h2 { font-size: 14px; margin: 0; padding: 11px 13px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .task h2 span { color: var(--muted); font-weight: 400; font-size: 12px; flex: 0 0 auto; }
  .task img { display: block; width: 100%; height: auto; background: #fff; border-top: 1px solid #f0f2f4; }
  /* 全屏居中加载遮罩 */
  .loading-mask { position: fixed; inset: 0; background: rgba(255,255,255,.82); display: flex; align-items: center; justify-content: center; z-index: 9999; }
  .loading-mask.hide { display: none; }
  .spinner { width: 46px; height: 46px; border: 4px solid #dbe3f0; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: 1px; text-align: center; }
  .dot { animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div class="top">
  <a href="./">← 返回</a>
  <h1>网页图片预览</h1>
</div>
<div class="wrap" id="root"></div>

<div class="loading-mask" id="loading">
  <div>
    <div class="spinner"></div>
    <div class="loading-text">请稍后<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
  </div>
</div>

<script>
const LS = { get: (k) => localStorage.getItem('pdf_ctrl_' + k) };
const token = (LS.get('token') || '').trim();
const owner = (LS.get('owner') || 'Kei-cobe').trim();
const repo = (LS.get('repo') || 'GetHtml2Pdf').trim();
const qs = new URLSearchParams(location.search);
const runId = qs.get('run') || '';
const filterName = qs.get('name') || '';
const root = document.getElementById('root');
const loadingEl = document.getElementById('loading');

function hideLoading() { loadingEl.classList.add('hide'); }

function apiHeaders() {
  const headers = { Accept: 'application/vnd.github+json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  return headers;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fail(msg, isErr) {
  hideLoading();
  root.innerHTML = `<div class="note${isErr ? ' err' : ''}">${esc(msg)}</div>`;
}

async function main() {
  if (!runId) return fail('缺少运行编号，请从控制台任务列表点击任务名进入。', true);
  // 图床分两级：优先 jsDelivr/raw 镜像（previews 分支，国内可达性好、支持 CORS），
  // 全部失败再回退 GitHub Release（release-assets 在部分网络下被阻断，仅作兜底）。
  const dlBase = `https://github.com/${owner}/${repo}/releases/download/preview-${encodeURIComponent(runId)}`;
  const cdnBases = [
    `https://cdn.jsdelivr.net/gh/${owner}/${repo}@previews/run-${encodeURIComponent(runId)}`,
    `https://fastly.jsdelivr.net/gh/${owner}/${repo}@previews/run-${encodeURIComponent(runId)}`,
    `https://gcore.jsdelivr.net/gh/${owner}/${repo}@previews/run-${encodeURIComponent(runId)}`,
    `https://raw.githubusercontent.com/${owner}/${repo}/previews/run-${encodeURIComponent(runId)}`,
  ];

  async function fetchWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { signal: ctrl.signal }); } finally { clearTimeout(t); }
  }

  let manifest = null;
  for (const base of cdnBases) {
    try {
      const res = await fetchWithTimeout(`${base}/manifest.json`, 8000);
      if (res.ok) { manifest = await res.json(); break; }
    } catch (e) { /* 镜像不可达，尝试下一个 */ }
  }

  if (!manifest) {
    // CDN 上没有（旧运行或未迁移），回退 Release API
    try {
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/releases/tags/preview-${encodeURIComponent(runId)}`, { headers: apiHeaders() });
      if (res.status === 404) {
        return fail('这次运行没有生成网页预览图：可能抓取任务全部失败，或设置里关闭了「网页图片预览」，或预览图已超过保留期限（最近 6 次）被清理。');
      }
      if (res.status === 401) {
        return fail('GitHub Token 已失效（HTTP 401）。请回到控制台，在设置里重新保存有效 Token 后再试。', true);
      }
      if (res.status === 403) {
        return fail('读取预览信息被 GitHub 限流（HTTP 403）。请回到控制台，在设置里保存有效的 GitHub Token 后再试。', true);
      }
      if (!res.ok) return fail('读取预览信息失败：HTTP ' + res.status, true);
      const release = await res.json();
      manifest = JSON.parse(release.body || '[]');
    } catch (e) {
      return fail('网络异常，无法读取预览清单：' + e.message + '。请检查网络后重试。', true);
    }
  }

  if (!Array.isArray(manifest) || !manifest.length) return fail('这次运行没有生成网页预览图。');

  // 按 URL 传入的 name 过滤（精确匹配），没有则展示全部
  let items = manifest;
  if (filterName) {
    items = manifest.filter(m => m.name === filterName);
    if (!items.length) {
      // 精确匹配没命中，退一步做宽松匹配（包含即可）
      items = manifest.filter(m => m.name.includes(filterName) || filterName.includes(m.name));
    }
    if (!items.length) {
      return fail(`这次运行里没有名为「${esc(filterName)}」的任务，可能任务名已变更或抓取失败。`);
    }
  }

  root.innerHTML = '';
  if (filterName && manifest.length > 1) {
    const note = document.createElement('div');
    note.className = 'note';
    note.innerHTML = `当前只展示「${esc(items[0].name)}」的预览图（共 ${manifest.length} 个任务）· <a href="preview.html?run=${encodeURIComponent(runId)}" style="color:var(--accent);">查看全部</a>`;
    root.appendChild(note);
  }
  for (const item of items) {
    const box = document.createElement('div');
    box.className = 'task';
    // 新格式：单张长图；旧格式：多段图（兼容）。每张图按 CDN 镜像 → Release 顺序回退。
    const files = [];
    if (item.image) {
      files.push(item.image);
    } else {
      for (let n = 1; n <= (item.images || 0); n++) {
        files.push(`${String(item.index).padStart(2, '0')}-${String(n).padStart(2, '0')}.jpg`);
      }
    }
    box.innerHTML = `<h2>${esc(item.name)}<span>${item.image ? '长图' : files.length + ' 张'}</span></h2>`;
    for (const file of files) {
      const candidates = [...cdnBases.map(b => `${b}/${file}`), `${dlBase}/${file}`];
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = item.name;
      let ci = 0;
      img.onerror = () => {
        ci++;
        if (ci < candidates.length) { img.src = candidates[ci]; return; }
        const tip = document.createElement('div');
        tip.className = 'note err';
        tip.textContent = '图片加载失败：' + file + '，可能已被清理或网络异常，请返回重试。';
        img.replaceWith(tip);
      };
      img.src = candidates[0];
      box.appendChild(img);
    }
    root.appendChild(box);
  }
  hideLoading();
}

main();
</script>
</body>
</html>
