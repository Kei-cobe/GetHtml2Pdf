name: 网页抓取并推送 PDF
run-name: ${{ inputs.label || '定时任务（自动）' }}

on:
  schedule:
    # GitHub 使用 UTC：以下时间已由控制台按北京时间自动换算。
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      tasks:
        description: "格式：备注 | https://网址；多个任务用英文分号隔开。留空则执行 tasks.json"
        required: false
        type: string
      label:
        description: "任务名称（仅用于运行标题展示）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: webpage-pdf-delivery
  cancel-in-progress: false

jobs:
  capture-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取并推送
        env:
          MANUAL_TASKS: ${{ inputs.tasks }}
          QQ_SMTP_USERNAME: ${{ secrets.QQ_SMTP_USERNAME }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          QQ_EMAIL_TO: ${{ secrets.QQ_EMAIL_TO }}
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: python pdf_pusher.py --config tasks.json --output-dir output

      - name: 发布网页预览图
        if: hashFiles('previews/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="preview-${GITHUB_RUN_ID}"
          gh release create "$TAG" --title "预览图 ${GITHUB_RUN_ID}" --notes "$(cat previews/run-${GITHUB_RUN_ID}/manifest.json)" >/dev/null 2>&1 || true
          # manifest.json 也作为 asset 上传：预览页直接下载它，无需调用 GitHub API（匿名 API 易 403 限流）
          gh release upload "$TAG" "previews/run-${GITHUB_RUN_ID}/manifest.json" --clobber
          find previews -type f -name '*.jpg' -print0 \
            | xargs -0 -r -n 20 gh release upload "$TAG" --clobber
          # 只保留最近 6 次预览发布，避免占用过多空间
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("preview-"))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: 推送预览图到 previews 分支（CDN 加速）
        if: hashFiles('previews/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          DEST=/tmp/previews-branch
          if git ls-remote --heads "$REPO_URL" previews | grep -q .; then
            git clone --depth 1 --branch previews "$REPO_URL" "$DEST"
          else
            mkdir -p "$DEST"
            git -C "$DEST" init -q
            git -C "$DEST" checkout -q --orphan previews
          fi
          git -C "$DEST" config user.name "github-actions[bot]"
          git -C "$DEST" config user.email "github-actions[bot]@users.noreply.github.com"
          # 只保留最近 5 次旧目录，加上本次共 6 次（目录名含 run id，按数字倒序）
          (cd "$DEST" && ls -d run-* 2>/dev/null | sort -t- -k2 -nr | tail -n +6 | xargs -r rm -rf) || true
          rm -rf "$DEST/run-${GITHUB_RUN_ID}"
          mkdir -p "$DEST/run-${GITHUB_RUN_ID}"
          cp "previews/run-${GITHUB_RUN_ID}/"* "$DEST/run-${GITHUB_RUN_ID}/"
          git -C "$DEST" add -A
          if git -C "$DEST" diff --cached --quiet; then
            echo "无变更，跳过推送"
          else
            git -C "$DEST" commit -q -m "预览图 run-${GITHUB_RUN_ID}"
            git -C "$DEST" push -q "$REPO_URL" previews
          fi

      - name: 备份 PDF 和运行产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webpage-pdf-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
